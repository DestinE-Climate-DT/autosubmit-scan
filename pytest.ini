[pytest]
# Pytest configuration for autosubmit-scan

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum Python version
minversion = 8.0

# Add current directory to Python path
pythonpath = .

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on unknown config options)
    --strict-config
    # Show warnings
    -W default
    # Coverage options
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # Parallel execution (if pytest-xdist is installed)
    # -n auto
    # JUnit XML report for CI
    --junitxml=test-results/junit.xml

# Markers
markers =
    unit: marks tests as unit tests (fast, no external dependencies)
    integration: marks tests as integration tests (require external services)
    e2e: marks tests as end-to-end tests (full system tests)
    remote: marks tests that require remote services (S3, SFTP, FTP)
    slow: marks tests as slow running (> 1 second)

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */.pixi/*
    */scripts/ci/*

[coverage:report]
exclude_lines =
    # Exclude pragma no cover
    pragma: no cover
    # Exclude defensive programming
    raise AssertionError
    raise NotImplementedError
    # Exclude type checking
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:
    # Exclude main guard
    if __name__ == .__main__.:
    # Exclude abstract methods
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov
