[workspace]
authors = ["Paul Gierz <pgierz@awi.de>"]
channels = ["conda-forge", "bioconda"]
name = "main"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
# Testing tasks
test = "pytest"
test-unit = "pytest -m unit"
test-integration = "pytest -m integration --remote"
test-e2e = "pytest -m e2e --remote"
test-fast = "pytest -m 'not slow'"
coverage-report = "pytest --cov --cov-report=term-missing --cov-report=html --cov-report=xml"

# Documentation tasks
generate-authors = "python scripts/generate_author_badges.py"

# CI setup tasks
ci-setup-minio = "python scripts/ci/setup_minio.py"
ci-setup-sftp = "python scripts/ci/setup_sftp.py"
ci-setup-ftp = "python scripts/ci/setup_ftp.py"

[dependencies]
# Core dependencies
loguru = ">=0.7.3,<0.8"
check-jsonschema = ">=0.33.3,<0.34"
returns = ">=0.26.0,<0.27"
questionary = ">=2.1.1,<3"
snakemake = ">=9.12.0,<10"
snakedeploy = ">=0.14.0,<0.15"
paramiko = ">=4.0.0,<5"
fsspec = ">=2024.9.0"
semver = ">=3.0.0,<4"
textual = ">=1.0.0,<2"
jinja2 = ">=3.1.0,<4"
pydantic = ">=2.0.0,<3"
pyyaml = ">=6.0.0,<7"

# Testing dependencies
pytest = ">=8.0.0,<9"
pytest-cov = ">=6.0.0,<7"
pytest-xdist = ">=3.6.0,<4"
pytest-timeout = ">=2.3.0,<3"

# Remote protocol dependencies
boto3 = ">=1.35.0,<2"
s3fs = ">=2024.9.0"
sshfs = ">=2024.9.0"

[pypi-dependencies]
click-loguru = ">=1.3.8, <2"
