[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosubmit-scan"
version = "0.1.0"
description = "Autosubmit workflow scanning and catalog management"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Paul Gierz", email = "paul.gierz@awi.de"}  # ORCID: 0000-0002-4512-087X
]
dependencies = [
    # Core dependencies
    "loguru>=0.7.3,<0.8",
    "check-jsonschema>=0.33.3,<0.34",
    "returns>=0.26.0,<0.27",
    "questionary>=2.1.1,<3",
    "snakemake>=9.12.0,<10",
    "snakedeploy>=0.14.0,<0.15",
    "paramiko>=4.0.0,<5",
    "fsspec>=2024.9.0",
    "semver>=3.0.0,<4",
    "textual>=1.0.0,<2",
    "jinja2>=3.1.0,<4",
    "pydantic>=2.0.0,<3",
    "pyyaml>=6.0.0,<7",
    "click-loguru>=1.3.8,<2",
    # Remote protocol dependencies
    "boto3>=1.35.0,<2",
    "s3fs>=2024.9.0",
    "sshfs>=2024.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0,<0.9",
]
test = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=6.0.0,<7",
    "pytest-xdist>=3.6.0,<4",
    "pytest-timeout>=2.3.0,<3",
]

[project.scripts]
as-scan = "src.cli.main:main"
autosubmit-scan = "src.cli.main:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.format]
line-ending = "auto"
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
